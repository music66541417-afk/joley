<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJ Panel 2</title>

  <!-- Fuente New Rocker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">
</head>

<body class="dj">
  <div class="container">

    <!-- =======================
         TOP BAR
    ======================== -->
    <div class="topbar">

      <div>
        <div class="title dj-title-status">
          <span
            class="orders-dot open header-status-dot"
            id="ordersDot"
            title="Pedidos abiertos"
            aria-label="Pedidos abiertos"
          ></span>

          🎧 Panel DJ 2
        </div>

        <div class="muted"></div>
      </div>

      <div class="top-actions">

        <span class="badge" id="countBadge">
          0 pendientes
        </span>

        <button
          class="btn btn-small"
          id="refreshBtn"
          type="button"
        >
          Actualizar
        </button>

        <button
          class="btn btn-small btn-danger"
          id="clearAllBtn"
          type="button"
        >
          Limpiar
        </button>

        <a
          class="btn btn-small"
          href="/dj2/fotos"
          target="_blank"
          rel="noopener"
        >
          Galería de fotos
        </a>

        <button
          class="btn btn-small"
          id="logoutBtn"
          type="button"
        >
          Salir
        </button>

      </div>
    </div>

    <!-- =======================
         CONTENIDO PRINCIPAL
    ======================== -->
    <div class="grid">

      <!-- SOLICITUDES -->
      <div class="requests-area">

        <div class="h2">
          Solicitudes
        </div>

        <div
          class="cards"
          id="cards"
        ></div>

        <div
          class="toast"
          id="emptyMsg"
          style="margin-top:12px;"
        ></div>

      </div>

      <!-- PANEL DERECHO -->
      <div class="panel">

        <div class="h2">
          Mesas
        </div>

        <div
          id="lastTables"
          class="muted"
        ></div>

      </div>

    </div>
  </div>

  <!-- =======================
       SCRIPTS
  ======================== -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/dj2.js"></script>
</body>
</html>
