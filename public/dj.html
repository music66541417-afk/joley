<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DJ Panel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="title">🎧 Panel DJ</div>
        <div class="muted">Pendientes aparecen aquí. Al marcar “Reproducida”, se elimina automáticamente.</div>
      </div>

      <div class="top-actions">
        <span class="badge" id="countBadge">0 pendientes</span>
        <button class="btn btn-small" id="refreshBtn" type="button">🔄 Actualizar</button>
        <button class="btn btn-small btn-danger" id="clearAllBtn" type="button">🧹 Limpiar</button>
      </div>
    </div>


    <div class="grid">
      <!-- Área grande -->
      <div class="requests-area">
        <div class="h2">Solicitudes</div>
        <div class="cards" id="cards"></div>
        <div class="toast" id="emptyMsg" style="margin-top:12px;"></div>
      </div>

      <!-- Panel derecho -->
      <div class="panel">
        <div class="h2">Últimas mesas agregadas</div>
        <div id="lastTables" class="muted" style="display:grid; gap:8px;"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/dj.js"></script>
</body>
</html>
