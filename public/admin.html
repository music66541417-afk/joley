<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Control Pedidos</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Switch simple (sin tocar tu CSS global) */
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input { display:none; }
    .slider {
      position:absolute;
      cursor:pointer;
      inset:0;
      background: rgba(255,255,255,0.14);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: .2s;
    }
    .slider:before{
      content:"";
      position:absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      top: 2px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      transition: .2s;
    }
    input:checked + .slider{
      background: rgba(78,225,138,0.16);
      border-color: rgba(78,225,138,0.75);
    }
    input:checked + .slider:before{
      transform: translateX(24px);
      background: rgba(78,225,138,0.45);
      border-color: rgba(78,225,138,0.75);
    }

    .admin-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 900px){
      .admin-grid{ grid-template-columns: 1fr; }
    }

    .rowline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top: 10px;
    }

    .big{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="title">🛡️ Panel Admin</div>
        <div class="muted">Abre/Cierra pedidos por piso y revisa solicitudes activas en vivo.</div>
      </div>

      <div class="top-actions">
        <span class="badge" id="connBadge">Conectando…</span>
        <button class="btn btn-small" id="logoutBtn" type="button">Salir</button>
      </div>
    </div>

    <div class="admin-grid">
      <!-- Piso 1 -->
      <div class="panel" style="max-width:none;">
        <div class="h2">DJ 1</div>

        <div class="rowline">
          <div class="muted">Solicitudes activas</div>
          <div class="big" id="count1">0</div>
        </div>

        <div class="rowline">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="orders-dot open" id="dot1"></span>
            <div>
              <div style="font-weight:800;">Pedidos</div>
              <div class="muted" id="label1">Abierto</div>
            </div>
          </div>

          <label class="switch" title="Abrir/Cerrar pedidos Piso 1">
            <input type="checkbox" id="toggle1" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Piso 2 -->
      <div class="panel" style="max-width:none;">
        <div class="h2">DJ 2</div>

        <div class="rowline">
          <div class="muted">Solicitudes activas</div>
          <div class="big" id="count2">0</div>
        </div>

        <div class="rowline">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="orders-dot open" id="dot2"></span>
            <div>
              <div style="font-weight:800;">Pedidos</div>
              <div class="muted" id="label2">Abierto</div>
            </div>
          </div>

          <label class="switch" title="Abrir/Cerrar pedidos Piso 2">
            <input type="checkbox" id="toggle2" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" style="margin-top:14px;"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
