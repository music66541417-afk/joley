<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login DJ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container" style="max-width:520px;">
    <div class="topbar" style="justify-content:center;">
      <div>
        <div class="title">🔒 Login DJ</div>
        <div class="muted">Ingresa para acceder al panel.</div>
      </div>
    </div>

    <form class="form" id="loginForm" autocomplete="off">
      <div>
        <label for="username">Usuario</label>
        <input id="username" name="username" maxlength="50" required />
      </div>

      <div>
        <label for="password">Clave</label>
        <input id="password" name="password" type="password" maxlength="80" required />
      </div>

      <!-- 🔑 destino después del login -->
      <input type="hidden" id="next" value="/dj" />

      <button class="btn" type="submit">Entrar</button>
      <div class="toast" id="toast"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const toast = document.getElementById("toast");
    const showToast = (m) => toast.textContent = m;

    // ✅ leer ?next=/dj o ?next=/dj2
    const params = new URLSearchParams(window.location.search);
    const nextInput = document.getElementById("next");
    nextInput.value = params.get("next") || "/dj";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showToast("");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const next = nextInput.value;

      try{
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ username, password, next })
        });

        const data = await res.json();
        if(!data.ok) return showToast(data.error || "No se pudo entrar.");

        // ✅ redirige automáticamente a /dj o /dj2
        window.location.href = data.next || "/dj";
      }catch{
        showToast("Error de conexión.");
      }
    });
  </script>
</body>
</html>
