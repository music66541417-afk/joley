<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login DJ - Jolly Roger</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="shell">
    <!-- IZQUIERDA: imagen full + texto encima -->
    <section class="left">
      <div class="left-overlay">
        <div class="welcome">
          <h1>Karaoke Jolly Roger</h1>
          <p>Acceso exclusivo para DJ. Ingresa tus credenciales para administrar las solicitudes.</p>
        </div>
      </div>
    </section>

    <!-- DERECHA: formulario -->
    <section class="right">
      <div class="card">
        <div class="card-head">
          <div class="kicker">INICIO DE SESIÓN</div>
          <h2>Ingreso DJ</h2>
          <p></p>
        </div>

        <form class="form" id="loginForm" autocomplete="off">
          <label class="field">
            <span>Usuario</span>
            <input id="username" name="username" maxlength="50" required placeholder="" />
          </label>

          <label class="field">
            <span>Contraseña</span>
            <input id="password" name="password" type="password" maxlength="80" required placeholder="" />
          </label>

          <!-- destino después del login -->
          <input type="hidden" id="next" value="/dj" />

          <button class="btn" type="submit">Entrar</button>
          <div class="toast" id="toast"></div>
        </form>

        <div class="foot">
          <span class="dot">•</span>
          <span>Acceso restringido / Registro de actividad activo</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const toast = document.getElementById("toast");
    const showToast = (m) => toast.textContent = m;

    // ✅ leer ?next=/dj o ?next=/dj2
    const params = new URLSearchParams(window.location.search);
    const nextInput = document.getElementById("next");
    nextInput.value = params.get("next") || "/dj";

    function resetLoginButton(){
      const btn = document.querySelector("#loginForm .btn");
      if(!btn) return;
      btn.classList.remove("loading");
      btn.textContent = btn.dataset.originalText || "Entrar";
    }

    // ✅ al volver con la flecha atrás (bfcache) se resetea el botón y el toast
    window.addEventListener("pageshow", () => {
      resetLoginButton();
      showToast("");
    });

    // ✅ opcional: al salir, lo deja limpio también
    window.addEventListener("pagehide", () => {
      resetLoginButton();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showToast("");

      const btn = form.querySelector(".btn");
      if(!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;

      // ✅ loader en el botón
      btn.classList.add("loading");
      btn.textContent = "Ingresando...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const next = nextInput.value;

      try{
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ username, password, next })
        });

        const data = await res.json();

        // ✅ SIEMPRE mensaje genérico (no filtra si fue usuario o clave)
        if(!data.ok){
          resetLoginButton();
          return showToast("Credenciales incorrectas.");
        }

        window.location.href = data.next || "/dj";
      }catch{
        // ✅ también genérico por seguridad
        resetLoginButton();
        showToast("Credenciales incorrectas.");
      }
    });
  </script>
</body>
</html>
