<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedir Canción</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="title">📲 Pedir canción</div>
        <div class="muted">Completa los datos y envía tu solicitud al DJ.</div>
        <div class="muted">Termino de solicitudes (02:30am).</div>
      </div>
      <span class="badge">Anti-spam activo</span>
    </div>

    <form class="form" id="requestForm" autocomplete="off">
      <div>
        <label for="table">Número de mesa</label>
        <input
          id="table"
          name="table"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Ej 13"
          maxlength="2"
          required
        />
      </div>

      <div>
        <label for="name">Nombre</label>
        <input id="name" name="name" placeholder="Ej: Esteban" maxlength="40" required />
      </div>

      <div>
        <label for="artist">Artista</label>
        <input id="artist" name="artist" placeholder="Ej: Alejandro Fernández" maxlength="40" required />
      </div>

      <div>
        <label for="song">Canción / Tema</label>
        <input id="song" name="song" placeholder="Ej: Mátalas" maxlength="40" required />
      </div>

      <button class="btn" type="submit">Enviar solicitud</button>
      <div class="toast" id="toast"></div>
    </form>

    <div class="toast muted" style="margin-top:14px;"></div>
  </div>

  <!-- Piso 2 -->
  <script src="/user2.js"></script>
</body>
</html>
